              <div style="flex: 1; height: 1px; background: var(--border);"></div>
            </div>
          </div>

          <!-- Email Inquiry Form -->
          <form action="https://formspree.io/f/myeylvad" method="POST">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="name" placeholder="Your Name" required>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
              <label for="phone">Phone / WhatsApp Number (Optional)</label>
              <input type="tel" id="phone" name="phone" placeholder="+961 70 000 000">
            </div>

            <div class="form-group">
  <label for="serviceType">Interested In</label>
  <select id="serviceType" name="service" required>
    <option value="tier-350" selected>5-Page Website Package ($350 Flat)</option>
    <option value="custom-web">Full-Stack Web Development</option>
    <option value="mobile">Cross-Platform Mobile Apps</option>
    <option value="booking">On-Demand & Booking Engines</option>
    <option value="api">APIs & Cloud Integrations</option>
    <option value="consulting">Code Refactoring & Optimization</option>
  </select>
</div>

            <div class="form-group">
              <label for="message">Project Outline or Target Pages</label>
              <textarea id="message" name="message" rows="5" placeholder="List the pages you need (e.g., Home, About, Services...), any features, or reference links..." required></textarea>
            </div>

            <button type="submit" class="btn" style="width: 100%; padding: 14px;">Send Message</button>
          </form>
        </div>
      </div>
    </section>

<script>
  // Automatically select the service passed via the URL query string
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const serviceParam = params.get('service');
    if (serviceParam) {
      const selectElement = document.getElementById('serviceType');
      if (selectElement) {
        selectElement.value = serviceParam;
      }
    }
  });
</script>
